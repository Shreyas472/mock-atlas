<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas &mdash; SRA VJTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="waveBg" aria-hidden="true"></canvas>
<div class="grain-veil" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">&#9670;</span>
    <span class="brand-name">ATLAS</span>
  </div>
  <div class="brand-sub">SRA&nbsp;VJTI &mdash; six domains, one system</div>
</header>

<main id="heroStage">
  <nav class="rail rail-left" id="railLeft" aria-label="Domains, left"></nav>

  <div class="hero-center">
    <div id="heroGlow" aria-hidden="true"></div>
    <img class="hero-img" src="assets/images/arm.png" alt="Wireframe illustration of a robotic gripper mechanism">
  </div>

  <nav class="rail rail-right" id="railRight" aria-label="Domains, right"></nav>
</main>


<script src="js/wave.js"></script>
<script src="js/main.js"></script>

</html>
